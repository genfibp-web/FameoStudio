<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fameo Studio | Enlaces Oficiales</title>
    <meta name="description" content="Todos los enlaces oficiales de Fameo Studio. Síguenos en Instagram, TikTok, YouTube, Facebook y Threads.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon1.png">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos específicos solo para la página de links */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #141414 0%, #050505 70%);
        }

        .link-page {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Corona */
        .link-crown {
            width: 60px;
            height: 45px;
            margin: 0 auto 20px auto;
            filter: drop-shadow(0 0 25px rgba(232, 184, 58, 0.7));
            animation: crownGlow 3s ease-in-out infinite;
        }
        .link-crown svg {
            width: 100%;
            height: 100%;
        }

        /* Logo circular */
        .link-logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(232, 184, 58, 0.5),
                0 0 80px rgba(232, 184, 58, 0.2),
                inset 0 0 30px rgba(232, 184, 58, 0.15);
            background-image: url('logo.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Título */
        .link-title {
            font-family: var(--font-display);
            font-size: 2.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1;
            background: linear-gradient(180deg, #FFFFFF 0%, #F5D76E 40%, #D4AF37 70%, #8B6914 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        /* Subtítulo */
        .link-subtitle {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--text-sec);
            letter-spacing: 1px;
            margin-bottom: 35px;
            padding: 0 20px;
        }

        /* Contenedor de botones */
        .link-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 35px;
        }

        /* Botón de red social */
        .social-btn {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 24px;
            background: var(--card-bg);
            border: 1.5px solid var(--border-hi);
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 0; height: 100%;
            background: linear-gradient(90deg, rgba(232, 184, 58, 0.15) 0%, transparent 100%);
            transition: width 0.4s ease;
        }

        .social-btn:hover {
            border-color: var(--gold-mid);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(232, 184, 58, 0.2);
        }

        .social-btn:hover::before {
            width: 100%;
        }

        .social-btn-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .social-btn-icon svg {
            width: 100%;
            height: 100%;
        }

        .social-btn-info {
            flex-grow: 1;
            text-align: left;
            position: relative;
            z-index: 1;
        }

        .social-btn-name {
            display: block;
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .social-btn-handle {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--text-mute);
            letter-spacing: 0.5px;
        }

        .social-btn-arrow {
            width: 18px;
            height: 18px;
            color: var(--gold-mid);
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s;
            position: relative;
            z-index: 1;
        }

        .social-btn:hover .social-btn-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Botón principal (Fameo Studio Web) */
        .main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            background: linear-gradient(135deg, #FFD966 0%, #E8B83A 50%, #D4AF37 100%);
            border: 1.5px solid var(--gold-bright);
            border-radius: 14px;
            text-decoration: none;
            color: #1a1a1a;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.35s;
            box-shadow: 0 0 30px rgba(232, 184, 58, 0.3);
            margin-bottom: 30px;
        }

        .main-btn:hover {
            background: linear-gradient(135deg, #FFF4B8 0%, #FFD966 50%, #E8B83A 100%);
            box-shadow: 0 0 50px rgba(232, 184, 58, 0.6);
            transform: translateY(-3px);
        }

        .main-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .link-footer {
            margin-top: 20px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }

        .link-footer p {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-mute);
        }

        /* Botón copiar link */
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            background: transparent;
            border: 1px solid var(--border-hi);
            color: var(--text-sec);
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .share-btn:hover {
            border-color: var(--gold-mid);
            color: var(--gold-bright);
        }

        .share-btn svg {
            width: 14px;
            height: 14px;
        }

        @media (max-width: 500px) {
            .link-logo { width: 110px; height: 110px; }
            .link-title { font-size: 2rem; }
            .social-btn { padding: 16px 20px; }
            .social-btn-icon { width: 28px; height: 28px; }
        }
    </style>
</head>
<body>

        <!-- Botón principal a la web -->

            <button class="share-btn" id="shareBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                </svg>
                Copiar Link
            </button>
        </div>

    </div>

   <script>
    // Botón de copiar link — siempre copia, sin abrir diálogo
    const shareBtn = document.getElementById('shareBtn');
    if (shareBtn) {
        shareBtn.addEventListener('click', async () => {
            const url = window.location.href;
            const textoOriginal = shareBtn.innerHTML;
            
            try {
                await navigator.clipboard.writeText(url);
                shareBtn.innerHTML = '✅ ¡Link Copiado!';
                shareBtn.style.borderColor = 'var(--gold-bright)';
                shareBtn.style.color = 'var(--gold-bright)';
                
                setTimeout(() => {
                    shareBtn.innerHTML = textoOriginal;
                    shareBtn.style.borderColor = '';
                    shareBtn.style.color = '';
                }, 2500);
            } catch (error) {
                // Fallback para navegadores sin clipboard API
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                
                shareBtn.innerHTML = '✅ ¡Link Copiado!';
                setTimeout(() => {
                    shareBtn.innerHTML = textoOriginal;
                }, 2500);
            }
        });
    }
</script>
